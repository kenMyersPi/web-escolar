<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <title>Panel Admin · KenMyers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="admin-body">

  <!-- LOGIN -->
  <div id="login-admin" class="login-box">
    <div class="login-icon">🔐</div>
    <h2>Acceso Admin</h2>
    <p class="sub">Solo KenMyers</p>
    <input type="email" id="admin-email" placeholder="Correo" autocomplete="email">
    <input type="password" id="admin-pass" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="loginAdmin()" id="btn-login">Entrar</button>
    <p id="error-login" class="error"></p>
  </div>

  <!-- PANEL -->
  <div id="panel-admin" style="display:none;">
    <header class="header header-admin">
      <div class="header-inner">
        <h1>Panel de Administración</h1>
        <p>KenMyers · Colegio Francisco Antonio Risquez</p>
        <button onclick="cerrarSesion()" class="btn-salir">Cerrar sesión</button>
      </div>
    </header>

    <div class="tabs">
      <button class="activo" data-tab="tab-horario">Horario</button>
      <button data-tab="tab-profes">Profesores</button>
      <button data-tab="tab-estudiantes">Estudiantes</button>
      <button data-tab="tab-notas">Notas</button>
      <button data-tab="tab-eval">Proyectos/Exámenes</button>
      <button data-tab="tab-anuncios">Anuncios</button>
    </div>

    <section id="tab-horario" class="tab activa">
      <div class="form-card">
        <h3>Nueva clase</h3>
        <div class="form-grid">
          <input id="h-dia" placeholder="Día (Lunes, Martes...)">
          <input id="h-hora" placeholder="Hora (7:00 - 8:00)">
          <input id="h-materia" placeholder="Materia">
          <input id="h-profesor" placeholder="Profesor">
        </div>
        <button onclick="agregarHorario()" class="btn-agregar">Agregar clase</button>
      </div>
      <ul id="admin-horario" class="lista-admin"></ul>
    </section>

    <section id="tab-profes" class="tab">
      <div class="form-card">
        <h3>Nuevo profesor</h3>
        <div class="form-grid">
          <input id="p-nombre" placeholder="Nombre completo">
          <input id="p-materia" placeholder="Materia que dicta">
        </div>
        <textarea id="p-resena" placeholder="Reseña / descripción"></textarea>
        <button onclick="agregarProfesor()" class="btn-agregar">Agregar profesor</button>
      </div>
      <ul id="admin-profes" class="lista-admin"></ul>
    </section>

    <section id="tab-estudiantes" class="tab">
      <div class="form-card">
        <h3>Nuevo estudiante</h3>
        <div class="form-grid">
          <input id="e-nombre" placeholder="Nombre completo">
          <input id="e-curso" placeholder="Curso / Año">
          <input id="e-clave" placeholder="Clave personal (para notas privadas)">
        </div>
        <button onclick="agregarEstudiante()" class="btn-agregar">Agregar estudiante</button>
      </div>
      <ul id="admin-estudiantes" class="lista-admin"></ul>
    </section>

    <section id="tab-notas" class="tab">
      <div class="form-card">
        <h3>Nueva nota</h3>
        <div class="form-grid">
          <select id="n-estudiante"></select>
          <input id="n-materia" placeholder="Materia">
          <input id="n-nota" type="number" placeholder="Nota (0-20)" step="0.01">
        </div>
        <label class="check"><input type="checkbox" id="n-privada"> Marcar como privada</label>
        <button onclick="agregarNota()" class="btn-agregar">Agregar nota</button>
      </div>
      <ul id="admin-notas" class="lista-admin"></ul>
    </section>

    <section id="tab-eval" class="tab">
      <div class="form-card">
        <h3>Nuevo proyecto / examen</h3>
        <div class="form-grid">
          <select id="ev-tipo">
            <option value="Proyecto">Proyecto</option>
            <option value="Examen">Examen</option>
          </select>
          <input id="ev-titulo" placeholder="Título">
          <input id="ev-materia" placeholder="Materia">
          <input id="ev-fecha" type="date">
        </div>
        <textarea id="ev-desc" placeholder="Descripción / instrucciones"></textarea>
        <button onclick="agregarEvaluacion()" class="btn-agregar">Agregar</button>
      </div>
      <ul id="admin-eval" class="lista-admin"></ul>
    </section>

    <section id="tab-anuncios" class="tab">
      <div class="form-card">
        <h3>Nuevo anuncio</h3>
        <input id="a-titulo" placeholder="Título">
        <textarea id="a-texto" placeholder="Contenido"></textarea>
        <button onclick="agregarAnuncio()" class="btn-agregar">Publicar anuncio</button>
      </div>
      <ul id="admin-anuncios" class="lista-admin"></ul>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
